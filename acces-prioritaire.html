<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fréquence Positive — Accès Prioritaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-fog:    #C8DDD0;
  --green-mid:    #A8C4B8;
  --green-deep:   #7BA898;
  --green-dark:   #4A7A6A;
  --green-bg:     #E8F2ED;
  --green-bg2:    #D4E8DF;
  --brown:        #7B4A3A;
  --brown-light:  #A06B58;
  --brown-dark:   #5A3028;
  --brown-ultra:  #3D1F16;
  --text-main:    #3A2820;
  --text-muted:   #6A5A52;
  --text-light:   #9A8A80;
  --white-soft:   rgba(255,255,255,0.85);
  --card-bg:      rgba(255,255,255,0.65);
  --card-border:  rgba(123,74,58,0.18);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--green-bg);
  color: var(--text-main);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ── CANVAS VAGUES ── */
#waveCanvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 0.45;
}

/* ── MANDALA décoratif ── */
.mandala-deco {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(700px, 100vw);
  height: min(700px, 100vw);
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
  animation: rotateSlow 80s linear infinite;
}
@keyframes rotateSlow { to { transform: translate(-50%,-50%) rotate(360deg); } }

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 18px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(200,221,208,0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(123,74,58,0.12);
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--brown);
  letter-spacing: 0.06em;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-links { display: flex; align-items: center; gap: 32px; }
.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.03em;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--brown); }
.nav-cta {
  background: var(--brown) !important;
  color: white !important;
  padding: 10px 24px !important;
  border-radius: 50px !important;
  font-weight: 500 !important;
  transition: background 0.2s !important;
}
.nav-cta:hover { background: var(--brown-dark) !important; }

/* ── PAGE WRAPPER ── */
.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 130px 24px 80px;
  text-align: center;
}

/* ── BADGE ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(123,74,58,0.1);
  border: 1px solid rgba(123,74,58,0.22);
  border-radius: 50px;
  padding: 7px 20px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--brown);
  margin-bottom: 32px;
  animation: fadeDown 0.8s ease both;
}
.badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--brown);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

/* ── TITRE HERO ── */
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.4rem, 6vw, 4.2rem);
  font-weight: 400;
  line-height: 1.15;
  color: var(--text-main);
  max-width: 680px;
  margin-bottom: 20px;
  animation: fadeDown 0.9s 0.1s ease both;
}
.hero-title em {
  font-style: italic;
  color: var(--brown);
}

.hero-sub {
  font-size: 15.5px;
  color: var(--text-muted);
  max-width: 520px;
  line-height: 1.75;
  margin-bottom: 44px;
  animation: fadeDown 1s 0.2s ease both;
}
.hero-sub strong { color: var(--brown-light); font-weight: 500; }

/* ── COMPTE À REBOURS ── */
.countdown-wrap {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 48px;
  animation: fadeDown 1s 0.3s ease both;
}
.cdown-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.cdown-val {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem;
  font-weight: 600;
  color: var(--brown);
  line-height: 1;
  min-width: 64px;
  text-align: center;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 12px 8px 7px;
  backdrop-filter: blur(8px);
}
.cdown-label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-light);
}
.cdown-sep {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  color: var(--brown-light);
  margin-top: 10px;
  opacity: 0.5;
}

/* ── CARTE FORMULAIRE ── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 48px 44px;
  width: 100%;
  max-width: 520px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(16px);
  box-shadow: 0 8px 48px rgba(123,74,58,0.08), 0 2px 12px rgba(123,74,58,0.05);
  animation: fadeUp 1s 0.4s ease both;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--brown-light), transparent);
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem;
  font-weight: 500;
  text-align: center;
  margin-bottom: 6px;
  color: var(--text-main);
}
.card-sub {
  font-size: 13px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 32px;
  line-height: 1.6;
}

/* ── CHAMPS ── */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}
.field label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 500;
}
.field input {
  background: rgba(255,255,255,0.7);
  border: 1px solid rgba(123,74,58,0.22);
  border-radius: 10px;
  padding: 14px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text-main);
  outline: none;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.field input::placeholder { color: var(--text-light); }
.field input:focus {
  border-color: var(--brown-light);
  background: rgba(255,255,255,0.9);
  box-shadow: 0 0 0 3px rgba(123,74,58,0.08);
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ── OPTIN ── */
.optin {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 20px 0 28px;
  padding: 16px;
  background: rgba(123,74,58,0.05);
  border: 1px solid rgba(123,74,58,0.14);
  border-radius: 12px;
  cursor: pointer;
}
.optin input[type="checkbox"] {
  appearance: none;
  width: 18px; height: 18px;
  min-width: 18px;
  border: 1.5px solid var(--brown-light);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  position: relative;
  margin-top: 1px;
  transition: background 0.2s, border-color 0.2s;
}
.optin input[type="checkbox"]:checked {
  background: var(--brown);
  border-color: var(--brown);
}
.optin input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  top: 2px; left: 5px;
  width: 5px; height: 9px;
  border: 2px solid white;
  border-top: none; border-left: none;
  transform: rotate(45deg);
}
.optin-text {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
}
.optin-text strong { color: var(--brown); }

/* ── BOUTON ── */
.btn-submit {
  width: 100%;
  padding: 17px;
  background: linear-gradient(135deg, var(--brown-dark), var(--brown), var(--brown-light));
  border: none;
  border-radius: 50px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: white;
  letter-spacing: 0.04em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(123,74,58,0.3);
}
.btn-submit::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.15);
  transform: translateX(-100%);
  transition: transform 0.4s ease;
}
.btn-submit:hover::before { transform: translateX(100%); }
.btn-submit:hover { opacity: 0.93; transform: translateY(-2px); box-shadow: 0 6px 28px rgba(123,74,58,0.38); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── MESSAGES ÉTAT ── */
.msg {
  display: none;
  text-align: center;
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 13px;
  margin-top: 16px;
  line-height: 1.5;
}
.msg.success {
  display: block;
  background: rgba(74,122,106,0.12);
  border: 1px solid rgba(74,122,106,0.3);
  color: var(--green-dark);
}
.msg.error {
  display: block;
  background: rgba(180,60,60,0.08);
  border: 1px solid rgba(180,60,60,0.22);
  color: #c0504a;
}

/* ── OFFRE SPÉCIALE ── */
.offre-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(123,74,58,0.06);
  border: 1px solid rgba(123,74,58,0.18);
  border-radius: 12px;
  padding: 14px 18px;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  text-align: left;
}
.offre-badge strong { color: var(--brown); }
.offre-icon { font-size: 1.4rem; flex-shrink: 0; }

/* ── PREUVES SOCIALES ── */
.social-proof {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 36px;
  font-size: 13px;
  color: var(--text-muted);
  animation: fadeUp 1s 0.6s ease both;
}
.avatars { display: flex; }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid var(--green-bg);
  background: var(--green-deep);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: white;
  margin-left: -8px;
}
.avatar:first-child { margin-left: 0; }

/* ── MERCI STATE ── */
.merci-wrap {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
  padding: 20px 0;
}
.merci-icon {
  font-size: 3rem;
  animation: bounceIn 0.6s ease;
}
.merci-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  color: var(--brown);
  font-weight: 400;
}
.merci-text { font-size: 14px; color: var(--text-muted); line-height: 1.7; }
@keyframes bounceIn {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); }
}

/* ── FOOTER ── */
footer {
  margin-top: 60px;
  text-align: center;
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: 0.05em;
  opacity: 0.75;
  animation: fadeUp 1s 0.7s ease both;
}
footer a { color: inherit; text-decoration: underline; opacity: 0.8; }

/* ── ANIMATIONS ── */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ── */
/* ── BURGER MENU ── */
.nav-burger {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 40px;
  height: 40px;
  z-index: 110;
}
.nav-burger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--brown);
  border-radius: 2px;
  transition: transform 0.25s ease, opacity 0.25s ease;
}
.nav-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-burger.open span:nth-child(2) { opacity: 0; }
.nav-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 768px) {
  nav { padding: 14px 20px; }
  .nav-burger { display: flex; }
  .nav-links {
    display: none;
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    background: rgba(200,221,208,0.98);
    flex-direction: column;
    align-items: flex-start;
    padding: 24px 28px;
    gap: 22px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.1);
    backdrop-filter: blur(8px);
  }
  .nav-links.open { display: flex; }
  .nav-links a { font-size: 16px; }
  .nav-links .nav-cta { margin-top: 8px; align-self: flex-start; }
}
@media (max-width: 600px) {
  nav { padding: 14px 20px; }
  .nav-links { display: none; }
  .card { padding: 36px 22px; }
  .field-row { grid-template-columns: 1fr; }
  .countdown-wrap { gap: 10px; }
  .cdown-val { font-size: 1.8rem; min-width: 52px; padding: 9px 6px 5px; }
}
</style>
</head>
<body>

<div style="min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:120px 24px 80px; font-family:'DM Sans', system-ui, sans-serif; background:#E8F2ED;">
  <div style="max-width:520px; background:rgba(255,255,255,0.85); border:1px solid rgba(123,74,58,0.18); border-radius:20px; padding:48px 40px;">
    <div style="font-size:2rem; margin-bottom:16px;">✦</div>
    <h1 style="font-family:'Cormorant Garamond',serif; font-weight:400; font-size:1.8rem; color:#3D1F16; margin-bottom:16px;">Fréquence Positive est disponible dès maintenant</h1>
    <p style="font-size:15px; color:#6A5A52; line-height:1.7; margin-bottom:32px;">Plus besoin d'attendre un accès prioritaire : tu peux créer ta séance personnalisée directement depuis notre page de commande.</p>
    <a href="commander.html" style="display:inline-block; background:#7B4A3A; color:white; text-decoration:none; padding:14px 32px; border-radius:50px; font-size:14px; font-weight:500;">✦ Créer ma séance personnalisée</a>
  </div>
</div>
</body>
