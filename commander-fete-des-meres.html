<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Spécial Fête des Mères — Matin & Soir : deux séances audio à télécharger sur ton téléphone, pour le matin et pour le soir. À écouter hors connexion. Édition limitée Fréquence Positive.">
<meta name="robots" content="noindex, nofollow">
<title>Offre terminée · Fréquence Positive</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brown: #7B4A3A;
    --brown-dark: #5A3028;
    --brown-deep: #3D1F16;
    --gold: #C8A882;
    --gold-dark: #a07850;
    --green-bg: #E8F2ED;
    --green-bg2: #D4E8DF;
    --cream: #f5f0ea;
    --text: #3A2820;
    --text-muted: #6A5A52;
    --border: rgba(123,74,58,0.18);
    --card-bg: rgba(255,255,255,0.65);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--green-bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 16px;
    overflow-x: hidden;
  }

  /* ──── HERO ──── */
  .hero {
    background: linear-gradient(180deg, var(--green-bg) 0%, var(--green-bg2) 100%);
    padding: 72px 24px 56px;
    text-align: center;
    position: relative;
  }

  .hero-logo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--brown-deep);
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-style: italic;
    margin-bottom: 24px;
  }

  .hero-tag {
    display: inline-block;
    background: rgba(123,74,58,0.10);
    border: 1px solid rgba(123,74,58,0.30);
    color: var(--brown);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 8px 22px;
    border-radius: 50px;
    margin-bottom: 28px;
    font-weight: 500;
  }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--brown-deep);
    margin-bottom: 18px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--brown);
  }

  .hero-sub {
    font-size: clamp(15px, 2vw, 17px);
    color: var(--text-muted);
    max-width: 560px;
    margin: 0 auto;
    font-weight: 300;
    line-height: 1.7;
  }

  /* ──── IMAGE ──── */
  .image-section {
    padding: 0 24px;
    margin: -20px auto 0;
    max-width: 900px;
    position: relative;
    z-index: 2;
  }

  .image-section img {
    width: 100%;
    height: auto;
    max-height: 380px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 12px 60px rgba(58,40,32,0.15);
    display: block;
  }

  /* ──── INTRO ──── */
  .intro {
    padding: 64px 24px 32px;
    max-width: 680px;
    margin: 0 auto;
    text-align: center;
  }

  .intro p {
    font-size: 17px;
    color: var(--text);
    line-height: 1.8;
    margin-bottom: 18px;
    font-weight: 300;
  }

  .intro p strong {
    font-weight: 500;
    color: var(--brown);
  }

  /* ──── LES DEUX SÉANCES ──── */
  .seances {
    padding: 32px 24px 56px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .seances-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .seance-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 32px;
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .seance-icon {
    font-size: 36px;
    margin-bottom: 16px;
    display: block;
  }

  .seance-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brown);
    font-weight: 500;
    margin-bottom: 14px;
  }

  .seance-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--brown-deep);
    margin-bottom: 14px;
    line-height: 1.3;
  }

  .seance-card p {
    color: var(--text-muted);
    line-height: 1.7;
    font-size: 15px;
    font-weight: 300;
  }

  .seance-meta {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--brown);
    letter-spacing: 0.05em;
  }

  /* ──── 3 ARGUMENTS ──── */
  .arguments {
    padding: 56px 24px;
    background: var(--cream);
  }

  .arguments-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .arguments-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    margin-top: 8px;
  }

  .argument {
    flex: 0 1 240px;
    max-width: 260px;
    text-align: center;
    padding: 24px 16px;
  }

  .argument-icon {
    font-size: 32px;
    margin-bottom: 14px;
    display: block;
  }

  .argument h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--brown-deep);
    margin-bottom: 8px;
  }

  .argument p {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.65;
  }

  /* ──── COMMENT ÇA SE PASSE ──── */
  .process {
    padding: 56px 24px;
  }

  .process-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.8rem, 3.5vw, 2.4rem);
    font-weight: 400;
    color: var(--brown-deep);
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.2;
  }

  .section-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-weight: 300;
    margin-bottom: 40px;
    font-size: 15px;
  }

  .steps {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 32px;
    align-items: flex-start;
  }

  .step {
    text-align: center;
    flex: 0 1 280px;
    max-width: 320px;
  }

  .step-number {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--brown-deep);
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    margin-bottom: 18px;
    font-style: italic;
  }

  .step h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--brown-deep);
    margin-bottom: 8px;
  }

  .step p {
    color: var(--text-muted);
    font-size: 14.5px;
    font-weight: 300;
    line-height: 1.7;
  }

  /* ──── BLOC PRIX + CTA ──── */
  .order {
    padding: 72px 24px;
    text-align: center;
    background: linear-gradient(180deg, var(--cream) 0%, var(--green-bg) 100%);
  }

  .order-card {
    max-width: 540px;
    margin: 0 auto;
    background: white;
    border-radius: 24px;
    padding: 56px 40px;
    box-shadow: 0 12px 50px rgba(58,40,32,0.10);
    border: 1px solid var(--border);
  }

  .order-tag {
    display: inline-block;
    background: rgba(200,168,130,0.18);
    color: var(--brown);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 7px 20px;
    border-radius: 50px;
    margin-bottom: 22px;
    font-weight: 500;
  }

  .order-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 500;
    color: var(--brown-deep);
    margin-bottom: 24px;
    line-height: 1.3;
  }

  .price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-weight: 500;
    color: var(--brown);
    margin: 12px 0 8px;
    letter-spacing: -0.01em;
  }

  .price-detail {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 32px;
    font-weight: 300;
  }

  .cta-button {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 18px 48px;
    border-radius: 50px;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 24px rgba(200,168,130,0.35);
  }

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(200,168,130,0.45);
  }

  .deadline {
    margin-top: 24px;
    font-size: 13px;
    color: var(--brown);
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .secure-note {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* ──── FOOTER ──── */
  footer {
    padding: 40px 24px;
    text-align: center;
    background: var(--brown-deep);
    color: rgba(240,232,221,0.7);
    font-size: 13px;
  }

  footer p {
    margin-bottom: 8px;
    font-weight: 300;
  }

  footer a {
    color: var(--gold);
    text-decoration: none;
  }

  footer .footer-links {
    margin-top: 14px;
    font-size: 12px;
  }

  footer .footer-links a {
    color: rgba(240,232,221,0.5);
    margin: 0 10px;
  }

  /* ──── FAQ ──── */
  .faq {
    padding: 56px 24px 32px;
    max-width: 800px;
    margin: 0 auto;
  }

  .faq-tag {
    display: inline-block;
    color: var(--brown);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 14px;
    text-align: center;
    width: 100%;
  }

  .faq-list { margin-top: 36px; }

  .faq-list details {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .faq-list details[open] {
    border-color: var(--gold);
    box-shadow: 0 6px 22px rgba(58,40,32,0.06);
  }

  .faq-list summary {
    cursor: pointer;
    padding: 20px 24px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--brown-deep);
    list-style: none;
    position: relative;
    padding-right: 56px;
    line-height: 1.4;
  }

  .faq-list summary::-webkit-details-marker { display: none; }

  .faq-list summary::after {
    content: '+';
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--brown);
    transition: transform 0.2s;
    line-height: 1;
  }

  .faq-list details[open] summary::after {
    content: '−';
    color: var(--gold-dark);
  }

  .faq-list .faq-answer {
    padding: 0 24px 22px;
    color: var(--text-muted);
    font-size: 14.5px;
    line-height: 1.7;
    font-weight: 300;
  }

  .faq-list .faq-answer p { margin: 0; }
  .faq-list .faq-answer p + p { margin-top: 10px; }
  .faq-list .faq-answer strong { color: var(--brown-deep); font-weight: 500; }
  .faq-list .faq-answer a { color: var(--brown); text-decoration: underline; }

  /* ──── RESPONSIVE ──── */
  @media (max-width: 600px) {
    .hero { padding: 48px 20px 40px; }
    .hero h1 { font-size: 2rem; }
    .order-card { padding: 40px 24px; }
    .price { font-size: 44px; }
    .seance-card { padding: 28px 22px; }
  }
</style>
</head>
<body>

<div style="min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:120px 24px 80px; font-family:'DM Sans', system-ui, sans-serif; background:#E8F2ED;">
  <div style="max-width:520px; background:rgba(255,255,255,0.85); border:1px solid rgba(123,74,58,0.18); border-radius:20px; padding:48px 40px;">
    <div style="font-size:2rem; margin-bottom:16px;">✦</div>
    <h1 style="font-family:'Cormorant Garamond',serif; font-weight:400; font-size:1.8rem; color:#3D1F16; margin-bottom:16px;">Cette offre n'est plus disponible</h1>
    <p style="font-size:15px; color:#6A5A52; line-height:1.7; margin-bottom:32px;">Cette page faisait partie d'une campagne Fête des Mères désormais terminée. Tu peux créer une séance personnalisée à tout moment sur notre page de commande.</p>
    <a href="commander.html" style="display:inline-block; background:#7B4A3A; color:white; text-decoration:none; padding:14px 32px; border-radius:50px; font-size:14px; font-weight:500;">✦ Créer ma séance personnalisée</a>
  </div>
</div>
</body>
</html>
